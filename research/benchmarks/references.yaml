# Labelled reference set — acceptance gate 4 (resolver precision)
#
# WHY THIS EXISTS
#
# The citations gate measures RECALL: 86.5% of real references resolve. It says
# nothing about the opposite direction — what the resolver does with a reference
# that does not exist. A resolver that matched everything to something would
# score perfect recall and be actively dangerous: it would rubber-stamp exactly
# the hallucinated citations this project exists to catch.
#
# So this set contains references whose truth is known in advance, and the gate
# measures the number that was missing: the FALSE-POSITIVE RATE.
#
# ============================================================================
# THE `fabricated` ENTRIES BELOW ARE SYNTHETIC AND DELIBERATELY FALSE.
# They are test fixtures. They describe papers that do not exist, or attach
# real components to each other in wrong combinations. Nothing here should be
# cited, quoted, or treated as a bibliography. They exist so the resolver can
# be measured against them.
# ============================================================================
#
# DESIGN
#
# Real entries have their DOI/arXiv id STRIPPED from the text and kept in
# `truth` instead. That forces the resolver down the free-text corroboration
# path — the hard one, and the one fabrications would also take — and lets the
# gate check not merely "did it resolve" but "did it resolve to the RIGHT
# paper". Leaving the DOI in the text would test a dictionary lookup.
#
# Fabrications mirror how LLMs actually hallucinate citations. The 2026 audits
# describe the dominant pattern as correct-looking titles carrying invented
# metadata, so the subtypes below are graded by how much genuine material they
# contain — `invented` is wholly false, `wrong-locator` is a real paper with one
# corrupted field. A resolver can fail at either end for different reasons.

thresholds:
  # A single confidently-resolved fabrication is a serious defect, but demanding
  # zero on a 20-item sample would over-claim from too little data. 0.10 is a
  # starting line to beat, not a statement that 10% is acceptable.
  max_false_positive_rate: 0.10
  # Recall on stripped identifiers is harder than the 86.5% citations gate,
  # which allowed the DOI shortcut. Set below it deliberately.
  min_true_positive_rate: 0.60

references:

  # ---- REAL — identifier stripped, kept as ground truth -------------------

  - id: real-01
    label: real
    text: "F. Benatti, R. Floreanini, Int. J. Mod. Phys. B 19, 3063 (2005)."
