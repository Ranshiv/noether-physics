  # ---- CORRUPTED — real papers, one field mistyped ------------------------
  #
  # Reclassified after the first benchmark run. These were originally labelled
  # `fabricated`, and the resolver "failed" them by matching the real paper. On
  # inspection that is the RIGHT answer: a librarian given "Koch, PRA 76,
  # 998877" says "you mistyped the page, you mean 042319". Resolving them is
  # correct; silently confirming them is not. They are scored separately, and
  # the resolver should ideally report the locator discrepancy — it does not
  # yet, which is recorded as a gap rather than counted as a false positive.

  # ---- FABRICATED — synthetic, describe nothing real ----------------------

  - id: fake-invented-01
    label: fabricated
    subtype: invented
    text: "Q. Thelwall, B. Krastovic, Phys. Rev. A 94, 042118 (2016)."
    note: |
      Surnames chosen to be absent from the physics literature.
      The first draft of this entry used "Marchetti" and it resolved at 0.80 —
      correctly. M. Cristina Marchetti is a real physicist who published in
      Phys. Rev. A 94 in 2016, so the "fabrication" accidentally described a
      real paper and the resolver was right to match it. Writing convincing
      fakes is harder than it looks: a plausible surname is plausible precisely
      because someone already has it.

  - id: fake-invented-02
    label: fabricated
    subtype: invented
    text: "R. Vasquez, T. Lindqvist, D. Oyelaran, Topological protection of driven qubit ensembles, Phys. Rev. Lett. 118, 190502 (2017)."
    note: "Plausible title in a real journal; the paper does not exist."

  - id: fake-invented-03
    label: fabricated
    subtype: invented
    text: "S. Nakagawa, Coherence revival in structured photonic baths, Nat. Phys. 15, 442 (2019)."
    note: "The classic phantom: real-sounding title, real journal, no such paper."

  - id: fake-frankenstein-01
    label: fabricated
    subtype: frankenstein
    text: "W.H. Zurek, Charge-insensitive qubit design derived from the Cooper pair box, Phys. Rev. A 76, 042319 (2007)."
    note: "Real title (Koch et al. 2007) attached to a real but unrelated author. Every component is genuine; the combination is not."

  - id: fake-frankenstein-02
    label: fabricated
    subtype: frankenstein
    text: "E.T. Jaynes, F.W. Cummings, Decoherence and the transition from quantum to classical, Rev. Mod. Phys. 75, 715 (2003)."
    note: "Real Zurek 2003 title and locator, real Jaynes-Cummings authors, wrong pairing."

  - id: fake-wrong-year-01
    label: fabricated
    subtype: wrong-year
    text: "W.H. Zurek, Phys. Rev. D 26, 1862 (1991)."
    note: "Real paper (1982), year shifted by nine. Tests whether year corroboration actually bites."

  - id: fake-wrong-year-02
    label: fabricated
    subtype: wrong-year
    text: "C. Abel et al., Phys. Rev. Lett. 124, 081803 (2014)."
    note: "Real nEDM letter (2020), year shifted by six."

  - id: corrupt-locator-01
    label: corrupted
    subtype: wrong-locator
    text: "J. Koch et al., Phys. Rev. A 76, 998877 (2007)."
    note: "Real paper, real authors, page number that does not exist. Tests the journal-coordinate lookup."

  - id: corrupt-locator-02
    label: corrupted
    subtype: wrong-locator
    text: "A. Wallraff et al., Nature 999, 162 (2004)."
    note: "Real paper, impossible volume."

  - id: fake-nonexistent-journal-01
    label: fabricated
    subtype: nonexistent-journal
    text: "M. Schlosshauer, Journal of Applied Decoherence Studies 14, 220 (2019)."
    note: "Real author, real year, journal that does not exist."
